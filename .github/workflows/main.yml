name: Scrape Science Bills

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Firefox system deps
        run: playwright install firefox --with-deps

      - name: Run scraper
        run: python scrape_sciencebill.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bills.csv
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update bills.csv [skip ci]"
          git push
